name: Release Multi-Platform Desktop App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Antigravity Proxy ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 Antigravity Proxy ${{ github.ref_name }}
            
            ### 安装指南
            - **macOS (Apple Silicon / M 系列芯片)**: 下载并安装 `.dmg` 文件。
            - **Windows (x64)**: 下载并运行 `.exe` (NSIS) 安装程序。
            
            ### 校验与依赖
            - 本地需安装官方 `agy` CLI 工具并完成登录。
            - 本地需具备 Python 3.10+ 环境。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
